name: videometer-lakehouse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    command: >
      sh -c "
      psql -h postgres -U ${POSTGRES_USER:-postgres} -c 'CREATE DATABASE airflow;' || true;
      psql -h postgres -U ${POSTGRES_USER:-postgres} -c 'CREATE DATABASE mlflow;' || true;
      psql -h postgres -U ${POSTGRES_USER:-postgres} -c 'CREATE DATABASE nessie;' || true;
      "

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    entrypoint: []
    command:
      - /bin/sh
      - -ec
      - |
        until /usr/bin/mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        /usr/bin/mc mb --ignore-existing local/bronze
        /usr/bin/mc mb --ignore-existing local/silver
        /usr/bin/mc mb --ignore-existing local/gold
        /usr/bin/mc mb --ignore-existing local/mlflow
        echo "MinIO buckets created"

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: lakehouse-spark:1.0.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - ./scripts:/opt/spark-app/scripts
      - ./data:/opt/spark-app/data
      - ./data_for_supervised_ml:/opt/spark-app/data_for_supervised_ml
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: lakehouse-spark:1.0.0
    depends_on:
      spark-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
    restart: unless-stopped

  mlflow:
    build:
      context: ./docker/mlflow
      dockerfile: Dockerfile
    image: lakehouse-mlflow:1.0.0
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      # CHANGEMENT ICI : /mlflow
      BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/mlflow
      ARTIFACT_ROOT: s3://mlflow/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  nessie:
    image: projectnessie/nessie:0.76.6
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      # CHANGEMENT ICI : /nessie
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      QUARKUS_HTTP_PORT: "19120"
      QUARKUS_OIDC_ENABLED: "false"
      QUARKUS_OPENTELEMETRY_ENABLED: "false"
      QUARKUS_OTEL_ENABLED: "false"
    ports:
      - "19120:19120"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:19120/api/v2/config >/dev/null 2>&1 || curl -fsS http://localhost:19120/api/v2/config >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: lakehouse-airflow:1.0.0
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # CHANGEMENT ICI : /airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-xJTMmtf4RO4UbEWw5dOS9BuobBISQ21gVc-7lx2Q8go=}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/spark-app/scripts
      - ./data:/opt/spark-app/data
      - ./data_for_supervised_ml:/opt/spark-app/data_for_supervised_ml
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@local --password admin || true
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: lakehouse-airflow:1.0.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # CHANGEMENT ICI : /airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-xJTMmtf4RO4UbEWw5dOS9BuobBISQ21gVc-7lx2Q8go=}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/spark-app/scripts
      - ./data:/opt/spark-app/data
      - ./data_for_supervised_ml:/opt/spark-app/data_for_supervised_ml
    ports:
      - "8088:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: lakehouse-airflow:1.0.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # CHANGEMENT ICI : /airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-xJTMmtf4RO4UbEWw5dOS9BuobBISQ21gVc-7lx2Q8go=}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/spark-app/scripts
      - ./data:/opt/spark-app/data
      - ./data_for_supervised_ml:/opt/spark-app/data_for_supervised_ml
    command: scheduler
    restart: unless-stopped

  prediction-api:
    build:
      context: ./docker/api
      dockerfile: Dockerfile
    image: lakehouse-prediction-api:1.0.0
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      MODEL_LOCAL_PATH: /opt/spark-app/data/models
      MODEL_NAME: Videometer_Model
      MODEL_STAGE: Production
    volumes:
      - ./data:/opt/spark-app/data
      - ./scripts:/opt/spark-app/scripts
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped


  streamlit-dashboard:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    image: lakehouse-streamlit-dashboard:1.0.0
    depends_on:
      prediction-api:
        condition: service_healthy
    environment:
      - API_URL=http://prediction-api:8000
    volumes:
      - ./scripts:/opt/spark-app/scripts
    ports:
      - "8501:8501"
    restart: unless-stopped

    
volumes:
  minio_data:
  postgres_data: